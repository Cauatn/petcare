services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    image: petcare-web
    ports:
      - "${WEB_PORT:-8080}:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: petcare-api
    ports:
      # Exposta para o ESP32 na rede local: http://<ip-do-pc>:3333/api/readings
      - "${API_PORT:-3333}:3333"
      # Descoberta UDP do ESP32 (porta fixa no firmware). Broadcast não atravessa a rede
      # bridge do Docker, então em container defina HOST_LAN_IP para o pareamento.
      - "3333:3333/udp"
    environment:
      PORT: 3333
      PUBLIC_API_PORT: ${API_PORT:-3333}
      DISCOVERY_PORT: 3333
      # IP do PC na rede local (ex.: 192.168.0.10). De dentro do container não dá para detectá-lo.
      HOST_LAN_IP: ${HOST_LAN_IP:-}
      MONGODB_URI: mongodb://mongo:27017/petcare
      CORS_ORIGIN: "*"
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
